name: Publish Release

# One-click release of cde, cdewin and cde-tauri:
#
#   1. checks the branch is develop and resolves the version (the version input, or the drafted
#      release's version)
#   2. checks the version is MAJOR.MINOR.PATCH, the tag is new, and the version is higher than the
#      latest tag
#   3. tags the commit (annotated, bare tag such as 2.1.0, no "v") and pushes the tag
#   4. calls release.yml, which builds, zips and publishes the release
#
# Run it from the Actions tab with "Use workflow from" set to develop. The dry run is the default:
# it does steps 1 and 2 and writes a summary, and changes nothing.
#
# A tag pushed with GITHUB_TOKEN does not start other workflows, so release.yml is called directly
# instead of relying on its tag trigger.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 2.1.0. Leave empty to use the drafted release version.'
        required: false
        type: string
      dry-run:
        description: 'Dry run: check the version and show what would be released, without tagging or publishing'
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    # contents: write both to read the draft release and to push the tag.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check branch
        run: |
          if [ "$GITHUB_REF_NAME" != "develop" ]; then
            echo "::error::Releases must be published from develop (got $GITHUB_REF_NAME)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: resolve
        # The input is passed through the environment, never interpolated into the script: a
        # workflow_dispatch input is attacker-controlled text.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"

          if [ -z "$version" ]; then
            version=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              --jq '[.[] | select(.draft)] | .[0].tag_name // ""')
            if [ -z "$version" ]; then
              echo "::error::No release draft found - pass an explicit version input"
              exit 1
            fi
            echo "Resolved from release draft: $version"
          fi

          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$version' is not a MAJOR.MINOR.PATCH version (no 'v' prefix)."
            exit 1
          fi

          # Tags are bare: 2.1.0, matching 1.7.1 and 2.0.0.
          tag="$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi

          # Refuse anything that is not an increase over the highest existing release tag.
          #
          # Release Drafter resolves the previous version from published GitHub Releases, not from
          # git tags, so if the draft looks wrong pass an explicit version input.
          latest=$(git tag --list '[0-9]*' --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -n "$latest" ] && \
             [ "$(printf '%s\n%s\n' "$version" "$latest" | sort -V | head -n1)" = "$version" ]; then
            echo "::error::$tag is not an increase over the latest tag $latest. If the release draft is wrong, pass an explicit version input."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (latest existing tag: ${latest:-none})"

      - name: Dry run summary
        if: ${{ inputs.dry-run }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          {
            echo "### Dry run - nothing was tagged or published"
            echo
            echo "Would tag **$(git rev-parse --short HEAD)** on develop as **$TAG** and release it."
            echo
            echo "Re-run with **dry-run** unchecked to tag and publish."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag
        if: ${{ !inputs.dry-run }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  release:
    name: Release
    needs: prepare
    if: ${{ !inputs.dry-run }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    # A called workflow gets at most what its caller grants.
    permissions:
      contents: write
      pull-requests: read
    secrets: inherit
