name: Publish Release

# One-click release of cde, cdewin and cde-tauri:
#
#   1. checks the branch is develop and resolves the version (the version input, or the drafted
#      release's version)
#   2. checks the version is MAJOR.MINOR.PATCH, the tag is new, and the version is higher than the
#      latest stable tag
#   3. tags the commit (annotated, bare tag such as 2.1.0, no "v") and pushes the tag
#   4. calls release.yml, which builds, zips and publishes the release
#
# Run it from the Actions tab with "Use workflow from" set to develop. The dry run is the default:
# it does steps 1 and 2 and writes a summary, and changes nothing.
#
# A tag pushed with GITHUB_TOKEN does not start other workflows, so release.yml is called directly
# instead of relying on its tag trigger.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 2.1.0. Leave empty to use the drafted release version.'
        required: false
        type: string
      dry-run:
        description: 'Dry run: check the version and show what would be released, without tagging or publishing'
        required: false
        default: true
        type: boolean

permissions: {}

# One publish at a time, so two runs cannot race to tag the same version. A queued run waits.
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    # contents: write both to read the draft release and to push the tag.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check branch
        run: |
          if [ "$GITHUB_REF_NAME" != "develop" ]; then
            echo "::error::Releases must be published from develop (got $GITHUB_REF_NAME)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: resolve
        # The input is passed through the environment, never interpolated into the script: a
        # workflow_dispatch input is attacker-controlled text.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"

          from_draft=false
          if [ -z "$version" ]; then
            # The newest stable-named draft across every page of releases: Release Drafter keeps a
            # single draft, but a stale one may linger from an earlier attempt. The selection is in
            # the tested release-version module.
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"
            version=$(node src/cde-tauri/scripts/release-version.mjs latest-draft --releases-file "$RUNNER_TEMP/releases.json")
            if [ -z "$version" ]; then
              echo "::error::No release draft found - pass an explicit version input"
              exit 1
            fi
            from_draft=true
            echo "Resolved from release draft: $version"
          fi

          # The rules (MAJOR.MINOR.PATCH, the tag is new, higher than the latest stable tag) live in
          # the tested release-version module. Tags are bare: 2.1.0, matching 1.7.1 and 2.0.0.
          #
          # Release Drafter resolves the previous version from published GitHub Releases, not from
          # git tags, so if the draft looks wrong pass an explicit version input.
          git tag --list > "$RUNNER_TEMP/tags.txt"
          args=(--version "$version" --tags-file "$RUNNER_TEMP/tags.txt")
          if [ "$from_draft" = true ]; then args+=(--from-draft); fi
          node src/cde-tauri/scripts/release-version.mjs validate-stable "${args[@]}"

          tag="$version"
          latest=$(node src/cde-tauri/scripts/release-version.mjs latest-stable --tags-file "$RUNNER_TEMP/tags.txt")

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (latest stable tag: ${latest:-none})"

      - name: Dry run summary
        if: ${{ inputs.dry-run }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          {
            echo "### Dry run - nothing was tagged or published"
            echo
            echo "Would tag **$(git rev-parse --short HEAD)** on develop as **$TAG** and release it."
            echo
            echo "Re-run with **dry-run** unchecked to tag and publish."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag
        if: ${{ !inputs.dry-run }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  release:
    name: Release
    needs: prepare
    if: ${{ !inputs.dry-run }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    # A called workflow gets at most what its caller grants.
    permissions:
      contents: write
      pull-requests: read

  # Measures performance of the new release in parallel with the build (perf.yml attaches perf.json to
  # the release once release.yml has created it, and opens a PR that refreshes the Readme table).
  perf:
    name: Performance
    needs: prepare
    if: ${{ !inputs.dry-run }}
    uses: ./.github/workflows/perf.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    permissions:
      contents: write
      pull-requests: write
