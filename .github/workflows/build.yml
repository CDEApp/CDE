name: .NET

on:
  # A branch with a pull request open is covered by the pull_request trigger below. Building it
  # here as well would run everything twice for the same commit.
  #
  # A change that touches only Markdown files (README, docs, CLAUDE.md, ...) doesn't run: nothing in
  # the build or tests reads a .md file today (if one ever does, narrow this pattern). A change with
  # any other file runs everything as usual. No branch requires
  # these checks; if one ever does, a skipped run reports nothing and the check waits forever, so
  # switch to skipping inside the jobs instead.
  push:
    branches: [ "develop", "main" ]
    paths-ignore: [ "**/*.md" ]
  pull_request:
    paths-ignore: [ "**/*.md" ]
  # So that a branch with no pull request open can still be built, on request.
  workflow_dispatch:

# Nothing here writes to the repository: SonarCloud and Codecov are each handed a token of their
# own. Naming a permission drops every other one to none, so a step that later needs to write
# fails loudly.
permissions:
  contents: read

jobs:
  build:

    runs-on: windows-latest
    # A pull request from a fork is not given the repository's secrets, so SONAR_TOKEN is empty
    # there and every SonarCloud step below skips itself. The build and tests still run.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
            #fetch depth 0 or gitversion breaks since it can't obtain the required tags etc.
            #SonarCloud also needs the history to attribute new code and blame.
            fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # 9.0.x runs the FlatSharp schema compiler (its newest build targets net9.0).
          dotnet-version: |
            9.0.x
            10.0.x
      # The SonarScanner for .NET runs on Java, 17 or later.
      - name: Set up JDK 17
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'zulu'
      - name: Cache SonarCloud packages
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v6
        with:
          path: ~\.sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Install SonarCloud scanner
        if: env.SONAR_TOKEN != ''
        run: dotnet tool install --global dotnet-sonarscanner
      # SonarCloud analyses what is compiled between "begin" and "end", so exactly one build sits
      # between them: the Debug build the tests run against. The Release publish below stays
      # outside, or every project would be analysed twice.
      #
      # SonarCloud's Automatic Analysis must be off for this project, or it refuses a CI analysis.
      #
      # Coverage is not measured for code that ships no tests by design: the Fallout build script,
      # the benchmark and memory-probe tools, and the Tauri frontend.
      - name: Begin SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        run: >
          dotnet sonarscanner begin
          /k:"CDEApp_CDE"
          /o:"cdeapp"
          /d:sonar.token="$env:SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.vscoveragexml.reportsPaths="TestResults/**/*.xml"
          /d:sonar.coverage.exclusions="build/**,src/cdeBenchmarks/**,src/cdeMemProbe/**,src/cde-tauri/**"
      - name: Build
        run: dotnet build src/cde.slnx --configuration Debug
      # Coverage comes from the Microsoft code coverage collector that Microsoft.NET.Test.Sdk already
      # brings in, so no test project needs a coverage package of its own. It writes one report per
      # format, merged across the test projects, under TestResults: Xml for SonarCloud, which does
      # not read Cobertura for C#, and Cobertura for Codecov, which does not read Xml.
      - name: Test
        run: >
          dotnet test src/cde.slnx --configuration Debug --no-build
          --collect "Code Coverage;Format=Xml,Cobertura"
          --results-directory TestResults
      # The Cobertura report is named *.cobertura.xml, so SonarCloud's TestResults/**/*.xml would take
      # it for a second Xml report. Moving it out leaves SonarCloud only the one it can read.
      # The collector names it <user>_<machine>_<timestamp>.cobertura.xml, which matches none of the
      # Codecov CLI's search patterns, so it gets a fixed name here and is handed to Codecov by name.
      - name: Separate Codecov report
        run: |
          New-Item -ItemType Directory -Force coverage | Out-Null
          Get-ChildItem TestResults -Recurse -Filter *.cobertura.xml | Move-Item -Destination coverage/coverage.cobertura.xml
      - name: End SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
      # The Codecov CLI refuses an upload without a token when the branch is protected, so
      # CODECOV_TOKEN is required, not optional. fail_ci_if_error stays at its default of false:
      # coverage is a report about the build, not a verdict on it, so a rejected upload shows only
      # in this step's log.
      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.cobertura.xml
          disable_search: true
      - name: Publish
        run: |
          ./build.ps1 publish
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: artifacts/

  # A Linux smoke test, so a Linux break shows on the pull request and not on release day. It publishes
  # cde and cdeApi for linux-x64 with the same Fallout target the release uses, checks that they start, scans and
  # searches a small folder with cde, and packs the cde tar.gz with the release staging script.
  #
  # It does not build the Tauri shell (slow, the release does) and does not run the .NET tests on Linux.
  linux:

    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      # The staging script asks the tested release-version module to check the version.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # 9.0.x runs the FlatSharp schema compiler (its newest build targets net9.0).
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Publish cde and cdeApi for linux-x64
        run: ./build.sh PublishRelease --self-contained true --runtime linux-x64
      # cde finds its appsettings.json itself; the one beside it is the last place it looks.
      - name: cde starts
        working-directory: artifacts/cde
        run: |
          chmod +x cde
          ./cde --version | sed -n 1p
          ./cde --help | grep -E '^  everything '
      # A real scan and search, as a user would run them. The scan writes its catalog into the current directory,
      # artifacts/cde. On Linux the catalog is named after the scanned path (#155): the path without its leading "/",
      # with every "/" replaced by "_".
      - name: cde scans and searches a folder
        working-directory: artifacts/cde
        run: |
          data="$RUNNER_TEMP/cde smoke data"
          mkdir -p "$data/reports" "$data/docs"
          echo a > "$data/report.txt"
          echo b > "$data/docs/report-2024.txt"

          ./cde scan "$data"
          expected="$(printf '%s' "${data#/}" | tr '/' '_').cdex"
          ls -l ./*.cdex
          test "$(ls ./*.cdex | wc -l)" -eq 1
          test -f "./$expected"

          folders="$(./cde everything "folder:report")"
          echo "$folders"
          test "$folders" = " $data/reports"
          ./cde everything "rep 2024" | grep -F "$data/docs/report-2024.txt"
          ./cde find report | grep -F "$data/report.txt"

          # A malformed query exits 1 with its position and prints no results.
          if ./cde everything "a ||" > "$RUNNER_TEMP/bad.out" 2> "$RUNNER_TEMP/bad.err"; then
            echo "::error::A malformed query must exit with 1."
            exit 1
          fi
          grep -F "(at position 3)" "$RUNNER_TEMP/bad.err"
          test ! -s "$RUNNER_TEMP/bad.out"
      # With no appsettings.json anywhere, cde starts from any directory on its built-in defaults and writes the default
      # into the config folder (#158). The single-file cde is copied on its own, so there is no file beside it either,
      # and CDE_CONFIG_DIR keeps the runner's home folder out of it.
      - name: cde writes its default settings when there are none
        run: |
          bin="$RUNNER_TEMP/cde-alone"
          mkdir -p "$bin" "$RUNNER_TEMP/elsewhere"
          cp artifacts/cde/cde "$bin/cde"
          export CDE_CONFIG_DIR="$RUNNER_TEMP/cde-config"
          cd "$RUNNER_TEMP/elsewhere"

          "$bin/cde" --version | sed -n 1p
          test -f "$CDE_CONFIG_DIR/appsettings.json"
          grep -F '"FirstPassSizeInBytes": 65536' "$CDE_CONFIG_DIR/appsettings.json"
          if grep -qF '"Seq"' "$CDE_CONFIG_DIR/appsettings.json"; then
            echo "::error::The default settings must not have a Seq sink."
            exit 1
          fi

          # A second run reads the file and does not write it again.
          before="$(stat -c %Y "$CDE_CONFIG_DIR/appsettings.json")"
          "$bin/cde" --version > /dev/null
          test "$(stat -c %Y "$CDE_CONFIG_DIR/appsettings.json")" = "$before"

          # Without CDE_CONFIG_DIR the config folder is ~/.config/cde (or $XDG_CONFIG_HOME/cde), and it need not exist
          # yet: a new account or a bare container has no ~/.config, and the default is still written.
          fresh="$RUNNER_TEMP/fresh-home"
          mkdir -p "$fresh"
          unset CDE_CONFIG_DIR XDG_CONFIG_HOME
          HOME="$fresh" "$bin/cde" --version | sed -n 1p
          test -f "$fresh/.config/cde/appsettings.json"
          xdg="$RUNNER_TEMP/xdg-home"
          mkdir -p "$xdg"
          XDG_CONFIG_HOME="$xdg" HOME="$RUNNER_TEMP/other-home" "$bin/cde" --version | sed -n 1p
          test -f "$xdg/cde/appsettings.json"
      # The sidecar prints {"url", "token"} on its first stdout line once it is listening.
      - name: cdeApi starts and prints its handshake
        working-directory: artifacts/cdeApi
        env:
          CDE_CONFIG_DIR: ${{ runner.temp }}/cdeapi-config
        run: |
          chmod +x cdeApi
          ./cdeApi > "$RUNNER_TEMP/api.out" 2> "$RUNNER_TEMP/api.err" &
          pid=$!
          for _ in $(seq 1 60); do [ -s "$RUNNER_TEMP/api.out" ] && break; sleep 0.5; done
          kill "$pid" 2>/dev/null || true
          cat "$RUNNER_TEMP/api.err"
          head -n1 "$RUNNER_TEMP/api.out"
          head -n1 "$RUNNER_TEMP/api.out" | grep -E '^\{"url":"http://127\.0\.0\.1:[0-9]+","token":"[0-9A-Fa-f]+"\}$'
      # The release's own staging script, without the Tauri parts: the archive holds cde with its executable
      # bit set, the checksum matches, and the extracted cde runs.
      - name: Stage the cde archive
        run: bash ./.github/scripts/stage-release-linux.sh --version 0.0.0 --no-tauri
      - name: Check the archive
        working-directory: artifacts/release
        run: |
          name=cde-0.0.0-linux-x64
          sha256sum -c "$name.tar.gz.sha256"
          tar -tvzf "$name.tar.gz" | grep -E -- "^-rwx[^ ]* .* $name/cde/cde$"
          if tar -tzf "$name.tar.gz" | grep -E 'cdewin|\.pdb$'; then
            echo "::error::The archive must not hold cdewin or debug symbols."
            exit 1
          fi
          mkdir extracted
          tar -xzf "$name.tar.gz" -C extracted
          cd "extracted/$name/cde"
          ./cde --version | sed -n 1p

  # The Tauri webview frontend: typecheck and unit tests. The Rust shell and the sidecar bundle are
  # not built here.
  cde-tauri:

    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/cde-tauri

    steps:
      - uses: actions/checkout@v7
      # Takes the pnpm version from packageManager in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: src/cde-tauri/package.json
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/cde-tauri/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Test
        run: pnpm test
