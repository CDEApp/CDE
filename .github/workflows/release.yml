name: Release

# Builds cde, cdewin and cde-tauri from a tag, zips them, and publishes the GitHub Release.
#
# The tag is bare (2.1.0, no "v"), or a pre-release (2.1.0-beta.1; alpha, beta or rc). A
# pre-release is published as a GitHub pre-release and is never "latest". The glob requires a digit
# first, so a tag that merely starts with a letter cannot fire a release. Releases are cut from develop: the tagged commit must be on
# it. Run Publish Release (release-publish.yml) to tag and release in one go; pushing a tag by hand
# also works.
#
# The zip, cde-<version>-win-x64.zip, holds:
#   cde/        cde.exe (self-contained, single file) + appsettings.json
#   cdewin/     cdewin.exe (self-contained, single file) + appsettings.json
#   cde-tauri/  cde-tauri.exe + cdeApi.exe (the sidecar)
on:
  push:
    tags: ['[0-9]*']
  # Called by release-publish.yml, which creates the tag and then invokes this workflow directly. A
  # tag pushed with GITHUB_TOKEN does not trigger the `push: tags` trigger above, so the call has
  # to be explicit.
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
  # To re-run a failed build for a tag that already exists (the tag blocks a new Publish Release for
  # that version). Choose the tag in "Tag", with the workflow run from develop.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. 2.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    # contents: write to publish the release and upload the assets; pull-requests: read for
    # Release Drafter to list the merged pull requests.
    permissions:
      contents: write
      pull-requests: read

    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # MinVer needs the full history and the tags to version the build from the tag.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          fetch-tags: true

      # Takes the pnpm version from packageManager in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: src/cde-tauri/package.json

      # Node runs the version rules below as well as the cde-tauri build.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/cde-tauri/pnpm-lock.yaml

      # A stable tag (2.1.0) or a pre-release tag (2.1.0-beta.1); the rules live in the tested
      # release-version module. A pre-release is published as a GitHub pre-release, from its own
      # draft, and is never "latest"; a stable release goes through the Release Drafter draft.
      - name: Check tag
        id: kind
        shell: bash
        run: |
          cli=src/cde-tauri/scripts/release-version.mjs

          # Whatever started this run (a tag push, Publish Release / Publish Pre-release, or a
          # re-run), the tag must be valid against the existing tags, leaving out the tag itself,
          # which exists by design. A hand-pushed 1.9.0 while 2.0.0 is released is refused here, so
          # it can never be built, published or marked "latest".
          git tag --list > "$RUNNER_TEMP/tags.txt"
          node "$cli" validate-release-tag --tag "$TAG" --tags-file "$RUNNER_TEMP/tags.txt"
          kind=$(node "$cli" tag-kind --tag "$TAG")
          if ! git merge-base --is-ancestor HEAD origin/develop; then
            echo "::error::Tag $TAG is not on develop. Releases are cut from develop."
            exit 1
          fi
          if [ "$kind" = prerelease ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Tag $TAG is a $kind"

      # The notes of a pre-release start at the latest stable tag.
      - name: Resolve latest stable tag
        id: stable
        shell: bash
        run: |
          git tag --list > "$RUNNER_TEMP/tags.txt"
          latest=$(node src/cde-tauri/scripts/release-version.mjs latest-stable --tags-file "$RUNNER_TEMP/tags.txt")
          echo "tag=$latest" >> "$GITHUB_OUTPUT"
          echo "Latest stable tag: ${latest:-<none>}"

      # Captured before publishing, because once this release is published it becomes "latest" and
      # can no longer serve as the previous tag. Only the stable path uses it, so a pre-release
      # skips it and cannot be aborted by it.
      - name: Resolve previous release tag
        if: ${{ steps.kind.outputs.prerelease == 'false' }}
        id: previous
        shell: bash
        run: |
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
                   --limit 20 --json tagName --jq '[.[] | select(.tagName | test("^[0-9]"))] | .[0].tagName // ""')
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
          echo "Previous release tag: ${prev:-<none>}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # 9.0.x runs the FlatSharp schema compiler (its newest build targets net9.0).
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src/cde-tauri/src-tauri -> target

      # One source of truth for the publish settings: the same Fallout target the CI build uses,
      # with --self-contained so cde and cdewin carry the .NET runtime (cdeApi always does).
      - name: Publish cde and cdewin
        run: ./build.ps1 PublishRelease --self-contained true

      - name: Install cde-tauri dependencies
        working-directory: src/cde-tauri
        run: pnpm install --frozen-lockfile

      # Publishes cdeApi and stages it as src-tauri/binaries/cdeApi-<target triple>.exe.
      - name: Bundle sidecar
        working-directory: src/cde-tauri
        run: pnpm bundle-sidecar

      - name: Stamp cde-tauri version
        working-directory: src/cde-tauri
        run: node scripts/stamp-version.mjs "$env:TAG"

      # --no-bundle builds the exe only (installers are deferred). tauri-build also copies the
      # sidecar next to it as target/release/cdeApi.exe, the name the app spawns.
      - name: Build cde-tauri
        working-directory: src/cde-tauri
        run: pnpm tauri build --no-bundle

      - name: Stage release folder
        run: ./.github/scripts/stage-release.ps1 -Version "$env:TAG" -Phase Stage

      # Fails the run if MinVer did not see the tag or the Tauri version was not stamped.
      - name: Verify versions match the tag
        run: ./.github/scripts/verify-release-versions.ps1 -Version "$env:TAG" -Root "artifacts/release/cde-$env:TAG-win-x64"

      - name: Zip and checksum
        run: ./.github/scripts/stage-release.ps1 -Version "$env:TAG" -Phase Zip

      # ---- Pre-release (alpha, beta, rc) ----
      #
      # The Release Drafter draft is for the next stable release and is left alone. A draft GitHub
      # release is created for the tag with the zip and checksum already attached, notes generated
      # since the latest stable tag, flagged as a pre-release and not "latest"; it is published as
      # the very last step.
      - name: Create pre-release draft
        if: ${{ steps.kind.outputs.prerelease == 'true' }}
        id: pre
        shell: bash
        env:
          STABLE_TAG: ${{ steps.stable.outputs.tag }}
        run: |
          # A draft left by an earlier failed run for this tag is replaced. A published release for
          # the tag makes `gh release create` fail below, which is right.
          cli=src/cde-tauri/scripts/release-version.mjs
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"
          old=$(node "$cli" draft-for-tag --tag "$TAG" --releases-file "$RUNNER_TEMP/releases.json")
          for id in $old; do
            echo "Deleting leftover draft $id"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done

          args=(--draft --prerelease --generate-notes --latest=false --title "$TAG")
          if [ -n "$STABLE_TAG" ]; then args+=(--notes-start-tag "$STABLE_TAG"); fi
          gh release create "$TAG" "${args[@]}" \
            "artifacts/release/cde-$TAG-win-x64.zip" \
            "artifacts/release/cde-$TAG-win-x64.zip.sha256"

          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"
          id=$(node "$cli" draft-for-tag --tag "$TAG" --releases-file "$RUNNER_TEMP/releases.json" | head -n1)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Draft pre-release id: $id"

      # Last step: everything is attached, so make the pre-release public. It stays a pre-release
      # and is not marked "latest".
      - name: Publish pre-release
        if: ${{ steps.kind.outputs.prerelease == 'true' }}
        shell: bash
        env:
          RELEASE_ID: ${{ steps.pre.outputs.id }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -F prerelease=true -f make_latest=false > /dev/null
          echo "Published pre-release $TAG"

      # ---- Stable release ----
      #
      # The release stays a draft until the very last step: the notes are brought up to date, the
      # assets are attached, and only then is it published. A failure before that leaves a draft to
      # fix and re-run, never a public release with no zip (which an immutable release would not
      # let us fix).
      #
      # Brings the rolling draft that Release Drafter has been accumulating from merged PRs up to
      # date for this tag, so any manual edits made to it are kept.
      - name: Update draft release
        if: ${{ steps.kind.outputs.prerelease == 'false' }}
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          publish: false
          tag: ${{ env.TAG }}
          name: ${{ env.TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find draft release
        if: ${{ steps.kind.outputs.prerelease == 'false' }}
        id: draft
        shell: bash
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"
          id=$(node src/cde-tauri/scripts/release-version.mjs draft-for-tag --tag "$TAG" --releases-file "$RUNNER_TEMP/releases.json" | head -n1)
          if [ -z "$id" ]; then
            echo "::error::No draft release for tag $TAG. If it was already published, there is nothing to do."
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Draft release id: $id"

      # draft: true keeps the release a draft; the action would otherwise publish it.
      - name: Upload release assets
        if: ${{ steps.kind.outputs.prerelease == 'false' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          draft: true
          files: |
            artifacts/release/cde-${{ env.TAG }}-win-x64.zip
            artifacts/release/cde-${{ env.TAG }}-win-x64.zip.sha256
          fail_on_unmatched_files: true

      # Release Drafter has no first-time-contributor detection, so borrow GitHub's own and append
      # its "New Contributors" section to the notes. Nice to have: a failure here must not stop the
      # release.
      - name: Append new contributors
        if: ${{ steps.kind.outputs.prerelease == 'false' }}
        continue-on-error: true
        shell: bash
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          if [ -n "$PREVIOUS_TAG" ]; then
            generated=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" -f previous_tag_name="$PREVIOUS_TAG" --jq .body)
          else
            generated=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body)
          fi

          # From the "New Contributors" heading to the next heading or the "Full Changelog" line,
          # which would otherwise add a second compare link.
          printf '%s\n' "$generated" | awk '
            /^## New Contributors/ { found = 1; print; next }
            found && (/^## / || /^\*\*Full Changelog\*\*/) { exit }
            found { print }' > new-contributors.md

          if [ ! -s new-contributors.md ]; then
            echo "No new contributors in this release."
            exit 0
          fi

          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .body > notes.md
          printf '\n' >> notes.md
          cat new-contributors.md >> notes.md
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F body=@notes.md > /dev/null
          echo "Appended:"
          cat new-contributors.md

      # Last step: everything is attached, so make the release public.
      - name: Publish release
        if: ${{ steps.kind.outputs.prerelease == 'false' }}
        shell: bash
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          # make_latest is set explicitly: "Check tag" has already validated this tag as higher than
          # every other stable tag, so it is the latest release.
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true > /dev/null
          echo "Published $TAG"
